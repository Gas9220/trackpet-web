  <meta name="theme-color" content="#0088ff">
  <meta property="og:type" content="website">

  <meta property="og:description" content="{{page_og_description|attr}}">
  <meta property="og:image" content="{{base_url}}images/{{lang}}/social.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:url" content="{{page_url}}">
  <link rel="canonical" href="{{page_url}}">
{{alternates}}
  <link rel="icon" type="image/png" href="{{root}}images/favicon.png">
  <link rel="apple-touch-icon" href="{{root}}images/apple-touch-icon.png">
  <script>
    // Before the page draws, so a theme chosen earlier doesn't flash the other one first.
    try {
      var chosenTheme = localStorage.getItem("theme");
      if (chosenTheme) document.documentElement.dataset.theme = chosenTheme;
    } catch (error) {}
  </script>
  <noscript><style>.theme-button { display: none; }</style></noscript>
  <link rel="stylesheet" href="{{root}}styles.css">
{{redirect_script}}
</head>

<!-- if:screenshots -->

<!-- end:screenshots -->

          <a href="{{home}}#mac">Mac</a>

        <a href="{{home}}support/">{{nav_support}}</a>

    </div>

  <script>
    // The language menu: closes on a click outside it or on Escape, keeps the section you're
    // reading when you switch, and remembers the choice so the English page stops redirecting.
    (function () {
      var menu = document.querySelector(".language-menu");
      document.addEventListener("click", function (event) {
        if (menu.open && !menu.contains(event.target)) menu.open = false;
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && menu.open) {
          menu.open = false;
          menu.querySelector("summary").focus();
        }
      });
      menu.querySelectorAll("a[data-language]").forEach(function (link) {
        link.addEventListener("click", function () {
          try { localStorage.setItem("language", link.dataset.language); } catch (error) {}
          link.href = link.href.split("#")[0] + location.hash;
        });
      });
    })();

    // The theme button: changes the theme and remembers the choice, until it's back to the device's
    // own, which the page then follows again. A screenshot's dark <source> normally asks for the
    // device's dark theme; while a theme is chosen, it's always or never used instead.
    (function () {
      var root = document.documentElement;
      var button = document.querySelector(".theme-button");
      var sources = document.querySelectorAll("picture source");
      var device = window.matchMedia("(prefers-color-scheme: dark)");

      function isDark() {
        return root.dataset.theme ? root.dataset.theme === "dark" : device.matches;
      }

      function update() {
        var media = { dark: "all", light: "not all" }[root.dataset.theme] || "(prefers-color-scheme: dark)";
        sources.forEach(function (source) { source.media = media; });
        var label = isDark() ? button.dataset.toLight : button.dataset.toDark;
        button.title = label;
        button.setAttribute("aria-label", label);
      }

      button.addEventListener("click", function () {
        var dark = !isDark();
        try {
          if (dark === device.matches) {
            localStorage.removeItem("theme");
          } else {
            localStorage.setItem("theme", dark ? "dark" : "light");
          }
        } catch (error) {}
        if (dark === device.matches) {
          delete root.dataset.theme;
        } else {
          root.dataset.theme = dark ? "dark" : "light";
        }
        update();
      });
      device.addEventListener("change", update);
      update();
    })();
  </script>

</body>
</html>
